name: mycv

services:
  app:
    container_name: mycv
    build:
      context: ./
      dockerfile: docker/images/node/Dockerfile
    ports:
      - '${DOCKER_NODEJS_PORT:-3000}:3000'
    volumes:
      - ./:/var/www
    working_dir: /var/www
    user: 'node'
    environment:
      HOST: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - default-network
networks:
  default-network:
    name: 'mycv-network'
    driver: bridge
